<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>QuotaPath Face Quiz</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    text-align: center;
  }

  .logo { font-size: 52px; margin-bottom: 14px; }
  h1 { font-size: 26px; font-weight: 800; color: #111; margin-bottom: 6px; }
  .tagline { color: #666; font-size: 15px; margin-bottom: 4px; }
  .team-meta { color: #aaa; font-size: 13px; margin-bottom: 28px; }

  .btn {
    display: inline-block;
    background: #00b386;
    color: #fff;
    border: none;
    padding: 13px 36px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    box-shadow: 0 4px 14px rgba(0,179,134,0.3);
  }
  .btn:hover { background: #009970; transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }

  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .q-label { font-size: 13px; color: #999; font-weight: 500; }
  .score-pill {
    background: #f0fdf8;
    color: #00b386;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .progress-track {
    height: 5px;
    background: #f0f0f0;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #00b386, #00d4a0);
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Photo ring with initials fallback */
  .photo-ring {
    width: 150px; height: 150px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 20px;
    border: 4px solid #f0fdf8;
    box-shadow: 0 6px 24px rgba(0,179,134,0.15);
    position: relative;
    flex-shrink: 0;
  }
  .photo-ring .initials-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -1px;
  }
  .photo-ring img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
  }
  .photo-ring img.hidden { display: none; }

  .who-label {
    font-size: 17px;
    font-weight: 600;
    color: #444;
    margin-bottom: 18px;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-bottom: 16px;
  }
  .choice {
    padding: 12px 8px;
    border: 2px solid #e8e8e8;
    border-radius: 12px;
    background: #fff;
    font-size: 13px;
    font-weight: 500;
    color: #333;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.35;
  }
  .choice:hover:not(:disabled) { border-color: #00b386; background: #f0fdf8; color: #00b386; }
  .choice.correct  { border-color: #22c55e !important; background: #f0fdf4 !important; color: #16a34a !important; font-weight: 700; }
  .choice.wrong    { border-color: #ef4444 !important; background: #fef2f2 !important; color: #dc2626 !important; }
  .choice.reveal   { border-color: #22c55e !important; background: #f0fdf4 !important; color: #16a34a !important; font-weight: 700; }
  .choice:disabled { cursor: default; }

  .feedback { min-height: 22px; font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .feedback.ok { color: #22c55e; }
  .feedback.no { color: #ef4444; }

  .btn-next {
    background: #111; color: #fff; border: none;
    padding: 11px 28px; border-radius: 50px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background 0.2s, transform 0.15s; margin-top: 4px;
  }
  .btn-next:hover { background: #333; transform: translateY(-1px); }

  .result-emoji { font-size: 54px; margin-bottom: 10px; }
  .result-score { font-size: 54px; font-weight: 900; color: #111; line-height: 1; margin-bottom: 6px; }
  .result-score .accent { color: #00b386; }
  .result-msg { color: #666; font-size: 15px; margin-bottom: 20px; }
  .result-list {
    text-align: left; max-height: 220px; overflow-y: auto;
    border-top: 1px solid #f0f0f0; padding-top: 8px; margin-bottom: 24px;
  }
  .result-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0; font-size: 13px; border-bottom: 1px solid #f9f9f9;
  }
  .result-thumb {
    width: 26px; height: 26px; border-radius: 50%;
    flex-shrink: 0; overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; color: #fff;
  }
  .result-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .result-row.ok { color: #16a34a; }
  .result-row.no { color: #dc2626; }
</style>
</head>
<body>

<div id="start" class="screen active">
  <div class="card">
    <div class="logo">🏢</div>
    <h1>Face Quiz</h1>
    <p class="tagline">Put a face to every name on the team</p>
    <p class="team-meta">72 QuotaPath teammates &nbsp;·&nbsp; 10 questions per round</p>
    <button class="btn" onclick="startQuiz()">Let's Go →</button>
  </div>
</div>

<div id="quiz" class="screen">
  <div class="card">
    <div class="quiz-header">
      <span class="q-label">Question <span id="qNum">1</span> / <span id="qTotal">10</span></span>
      <span class="score-pill">★ <span id="scoreDisplay">0</span></span>
    </div>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    <div class="photo-ring" id="photoRing">
      <div class="initials-fallback" id="initialsEl"></div>
      <img id="quizPhoto" src="" alt="" />
    </div>
    <p class="who-label">Who is this?</p>
    <div class="choices" id="choicesEl"></div>
    <div class="feedback" id="feedbackEl"></div>
    <button class="btn-next" id="nextBtn" style="display:none" onclick="advance()">Next →</button>
  </div>
</div>

<div id="results" class="screen">
  <div class="card">
    <div class="result-emoji" id="resultEmoji"></div>
    <div class="result-score"><span class="accent" id="finalScore">0</span>/<span id="finalTotal">10</span></div>
    <p class="result-msg" id="resultMsg"></p>
    <div class="result-list" id="resultList"></div>
    <button class="btn" onclick="startQuiz()">Play Again</button>
  </div>
</div>

function colorFor(name) { let h=0; for(let c of name) h=(h<<5)-h+c.charCodeAt(0); return COLORS[Math.abs(h)%COLORS.length]; }

// ── State ──
let questions=[], currentQ=0, score=0, roundResults=[], answered=false;

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function show(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  questions=shuffle(TEAM).slice(0,10);
  currentQ=0; score=0; roundResults=[];
  document.getElementById('qTotal').textContent=questions.length;
  document.getElementById('finalTotal').textContent=questions.length;
  show('quiz');
  renderQ();
}

function setPhoto(person) {
  const ring = document.getElementById('photoRing');
  const img  = document.getElementById('quizPhoto');
  const ini  = document.getElementById('initialsEl');

  // Set background color for initials fallback
  ring.style.background = colorFor(person.name);
  ini.textContent = initials(person.name);

  // Try loading the real photo on top
  img.classList.remove('hidden');
  img.onerror = () => img.classList.add('hidden');
  img.src = person.photo;
}

function renderQ() {
  answered=false;
  const q=questions[currentQ], total=questions.length;
  document.getElementById('qNum').textContent=currentQ+1;
  document.getElementById('scoreDisplay').textContent=score;
  document.getElementById('progressBar').style.width=`${(currentQ/total)*100}%`;
  document.getElementById('feedbackEl').textContent='';
  document.getElementById('feedbackEl').className='feedback';
  document.getElementById('nextBtn').style.display='none';

  setPhoto(q);

  const wrongs=shuffle(TEAM.filter(p=>p.name!==q.name)).slice(0,3);
  const opts=shuffle([q,...wrongs]);
  const el=document.getElementById('choicesEl');
  el.innerHTML='';
  opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='choice';
    btn.textContent=opt.name;
    btn.dataset.name=opt.name;
    btn.onclick=()=>pick(opt.name===q.name,btn,q.name);
    el.appendChild(btn);
  });
}

function pick(correct,btn,correctName) {
  if(answered)return;
  answered=true;
  if(correct)score++;
  roundResults.push({...questions[currentQ],correct});
  const fb=document.getElementById('feedbackEl');
  if(correct){
    btn.classList.add('correct');
    fb.textContent='✓ Correct!'; fb.className='feedback ok';
  } else {
    btn.classList.add('wrong');
    fb.textContent='✗ Not quite!'; fb.className='feedback no';
    document.querySelectorAll('.choice').forEach(b=>{if(b.dataset.name===correctName)b.classList.add('reveal');});
  }
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  document.getElementById('scoreDisplay').textContent=score;
  const nb=document.getElementById('nextBtn');
  nb.textContent=currentQ===questions.length-1?'See Results →':'Next →';
  nb.style.display='inline-block';
}

function advance() {
  currentQ++;
  if(currentQ>=questions.length)showResults();
  else renderQ();
}

function showResults() {
  const total=questions.length, pct=score/total;
  let emoji,msg;
  if(pct===1){emoji='🏆';msg='Perfect score! You really know your team!';}
  else if(pct>=0.8){emoji='🎉';msg='Great job — you know your teammates well!';}
  else if(pct>=0.6){emoji='👍';msg="Solid! A few more Slack convos and you'll nail it.";}
  else if(pct>=0.4){emoji='🤔';msg='Getting there — maybe time to do some intros!';}
  else{emoji='😅';msg='Time to schedule some 1:1s!';}

  document.getElementById('resultEmoji').textContent=emoji;
  document.getElementById('finalScore').textContent=score;
  document.getElementById('resultMsg').textContent=msg;
  document.getElementById('progressBar').style.width='100%';

  document.getElementById('resultList').innerHTML=roundResults.map(r=>`
    <div class="result-row ${r.correct?'ok':'no'}">
      <span>${r.correct?'✅':'❌'}</span>
      <div class="result-thumb" style="background:${colorFor(r.name)}">
        <span style="position:relative;z-index:1">${initials(r.name)}</span>
        <img src="${r.photo}" onerror="this.style.display='none'" />
      </div>
      <span>${r.name}</span>
    </div>
  `).join('');
  show('results');
}
</script>
</body>
</html>
